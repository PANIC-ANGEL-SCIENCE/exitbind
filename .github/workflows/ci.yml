name: Exitbind / Exit
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      proof_base:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  EXITBIND_EXPECTED_SHA: ${{ inputs.candidate_sha || github.sha }}
concurrency:
  group: ${{ (github.event_name == 'pull_request' && format('{0}-pull-request-{1}', github.workflow, github.event.pull_request.number)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') && format('{0}-feature-push-{1}', github.workflow, github.ref)) || format('{0}-protected-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) }}
jobs:
  scope:
    if: github.ref != 'refs/heads/readme-badges'
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.detect.outputs.scope }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: ${{ github.event.repository.private == true && 1 || 0 }}
      - name: Complete selected Git history
        env:
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          VALUE_PROOF_BASE: ${{ inputs.proof_base || github.event.pull_request.base.sha || github.event.before }}
        run: ./tooling/repository/ci/ci-selected-history.sh
      - id: detect
        env:
          BASE_SHA: ${{ inputs.proof_base || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: python3 tooling/repository/ci/readme/ci_scope.py >> "$GITHUB_OUTPUT"
  readme:
    needs: scope
    if: needs.scope.outputs.scope == 'readme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: ${{ github.event.repository.private == true && 1 || 0 }}
      - name: Existing README rules
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/readme-target
        run: sh tooling/repository/ci/readme/check-existing.sh
  exit:
    needs: scope
    if: needs.scope.outputs.scope != 'readme'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      statuses: read
    env:
      VALUE_PROOF_BASE: ${{ inputs.proof_base || github.event.pull_request.base.sha || github.event.before }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      # Keep test runtime practical without changing the release profile or assertions.
      # Set these before cache restoration so the Cargo profile enters its key.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      EXITBIND_FETCH_VALIDATOR: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: ${{ github.event.repository.private == true && 1 || 0 }}
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$EXITBIND_EXPECTED_SHA"
      - name: Complete selected Git history
        env:
          GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: ./tooling/repository/ci/ci-selected-history.sh
      - name: Prepare source proof paths
        env:
          PROOF_RUNNER_TEMP: ${{ runner.temp }}
        run: |
          printf 'CARGO_TARGET_DIR=%s/exitbind-target\nTMPDIR=%s/exitbind-fixtures\nCI_LOG_ROOT=%s/exitbind-logs\n' \
            "$PROOF_RUNNER_TEMP" "$PROOF_RUNNER_TEMP" "$PROOF_RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare fixture and log roots
        run: mkdir -p "$TMPDIR" "$CI_LOG_ROOT"
      - name: Prepare native handoff dependency
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Prepare dependency-cache target path
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/exitbind-target
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          target = os.path.realpath(os.environ["CARGO_TARGET_DIR"])
          relative = os.path.relpath(target, workspace)
          if os.path.isabs(relative) or not relative:
              raise SystemExit("Cargo target cache path must be relative to the workspace")
          print(f"EXITBIND_CACHE_TARGET={relative}")
          PY
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> ${{ env.EXITBIND_CACHE_TARGET }}
          cache-targets: true
          cache-bin: false
          cache-all-crates: false
          cache-workspace-crates: false
      - name: Find compatible executed source proof
        id: source-proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tooling/repository/ci/source-proof.py find ci >> "$GITHUB_OUTPUT"
      - name: Test paired prerelease controls without network writes
        if: steps.source-proof.outputs.reuse != 'true'
        run: python3 -m unittest discover -s tests -p test_paired_prerelease.py -v
      - name: Test source proof controls without network writes
        if: steps.source-proof.outputs.reuse != 'true'
        run: python3 -m unittest discover -s tests -p 'test_source_proof*.py' -v
      - name: Test README tooling
        if: steps.source-proof.outputs.reuse != 'true' || steps.source-proof.outputs.ci_package != 'true'
        run: python3 -m unittest discover -s tooling/repository/ci/readme -v
      - name: Verify Cargo package excludes README presentation tooling
        if: steps.source-proof.outputs.reuse != 'true' || steps.source-proof.outputs.ci_package != 'true'
        run: |
          package_list=$(mktemp)
          cargo package --list --locked > "$package_list"
          test -s "$package_list"
          for required in Cargo.toml Cargo.lock LICENSE src/main.rs; do
            grep -Fx "$required" "$package_list" >/dev/null
          done
          if grep -E '^(assets/readme/|tooling/repository/ci/readme/|\.github/workflows/readme-badges\.yml$)' "$package_list"; then
            echo 'README presentation files leaked into the Cargo package'
            exit 1
          fi
          echo 'Cargo package excludes README assets and tooling'
      - name: Run shared native CI checks and packaging
        id: source-checks
        if: steps.source-proof.outputs.reuse != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/exitbind-target
          TMPDIR: ${{ runner.temp }}/exitbind-fixtures
          CI_LOG_ROOT: ${{ runner.temp }}/exitbind-logs
          CARGO_BUILD_JOBS: '2'
          EXITBIND_FETCH_VALIDATOR: '1'
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
        run: ./tooling/repository/ci/ci-local.sh
      - name: Recheck changed source context
        if: steps.source-proof.outputs.reuse == 'true'
        env:
          CI_REUSE_PRIVACY: ${{ steps.source-proof.outputs.privacy }}
          CI_REUSE_SCHEMA: ${{ steps.source-proof.outputs.schema }}
        run: ./tooling/repository/ci/ci-local.sh --context-only
      - name: Rebuild and verify the current package
        if: steps.source-proof.outputs.reuse == 'true' && steps.source-proof.outputs.ci_package != 'true'
        run: ./tooling/repository/ci/ci-local.sh --package-only
      - name: Reuse completed CI qualification
        if: steps.source-proof.outputs.reuse == 'true' && steps.source-proof.outputs.ci_package == 'true'
        run: echo 'Reused the originating CI build, onboarding, package, and installer checks.'
      - name: Write executed source proof
        id: executed-proof
        continue-on-error: true
        if: steps.source-checks.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository_id)
        run: |
          name=$(python3 tooling/repository/ci/source-proof.py write "$RUNNER_TEMP/source-proof.json" ci)
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      - name: Upload executed source proof
        continue-on-error: true
        if: steps.executed-proof.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.executed-proof.outputs.name }}
          path: ${{ runner.temp }}/source-proof.json
          if-no-files-found: error
          retention-days: 30
  audit:
    needs: scope
    if: needs.scope.outputs.scope != 'readme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$EXITBIND_EXPECTED_SHA"
      - name: Cache cargo-audit
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned cargo-audit when uncached
        run: |
          if ! command -v cargo-audit >/dev/null; then
            cargo +stable install cargo-audit --locked --version 0.22.2
          fi
      - run: cargo audit
