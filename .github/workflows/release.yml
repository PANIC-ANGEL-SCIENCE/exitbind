name: Exitbind stable release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release a tag, or validate an integration candidate before main
        type: choice
        options: [release, stable-readiness]
        default: release
  push:
    tags:
      - "v0.*"

permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      full_platforms: ${{ steps.channel.outputs.full_platforms }}
      readiness_only: ${{ steps.channel.outputs.readiness_only }}
      targets: ${{ steps.channel.outputs.targets }}
      installed: ${{ steps.channel.outputs.installed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select checked release channel and platforms
        id: channel
        env:
          RELEASE_MODE: ${{ inputs.mode || 'release' }}
        run: python3 tooling/repository/release/release-channel.py --mode "$RELEASE_MODE"
  linux:
    needs: channel
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preserve published Git ancestry
        run: ./tooling/repository/release/check-public-history.sh
      - name: Require the release tag at the current main commit
        if: needs.channel.outputs.prerelease == 'false' && needs.channel.outputs.readiness_only == 'false'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Cache cargo-audit
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install and verify pinned cargo-audit
        run: |
          if ! test "$(cargo-audit --version 2>/dev/null)" = "cargo-audit 0.22.2"; then
            cargo +stable install cargo-audit --locked --version 0.22.2 --force
          fi
          test "$(cargo-audit --version)" = "cargo-audit 0.22.2"
      - name: Prepare native handoff dependency
        run: command -v tmux >/dev/null || (sudo apt-get update && sudo apt-get install -y tmux)
      - name: Prepare reusable native build paths
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/exitbind-target
          EXITBIND_FIXTURE_ROOT: ${{ runner.temp }}/exitbind-fixtures
          EXITBIND_LOG_ROOT: ${{ runner.temp }}/exitbind-logs
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          target = os.path.realpath(os.environ["CARGO_TARGET_DIR"])
          relative = os.path.relpath(target, workspace)
          if os.path.isabs(relative) or not relative:
              raise SystemExit("Cargo target cache path must be relative to the workspace")
          print(f"EXITBIND_CACHE_TARGET={relative}")
          print(f"CARGO_TARGET_DIR={target}")
          print(f"TMPDIR={os.environ['EXITBIND_FIXTURE_ROOT']}")
          print(f"CI_LOG_ROOT={os.environ['EXITBIND_LOG_ROOT']}")
          PY
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> ${{ env.EXITBIND_CACHE_TARGET }}
          cache-targets: true
          cache-bin: false
          cache-all-crates: false
          cache-workspace-crates: false
      - name: Test paired prerelease controls without network writes
        run: python3 -m unittest discover -s tests -p test_paired_prerelease.py -v
      - name: Run shared native CI checks
        env:
          EXITBIND_FETCH_VALIDATOR: '1'
        run: ./tooling/repository/ci/ci-local.sh --checks-only
      - run: cargo audit
      - name: Build native Linux stable release
        env:
          EXITBIND_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked
      - name: Exercise first-user path without language toolchains
        run: ./tooling/repository/release/onboarding-smoke.sh "$CARGO_TARGET_DIR/release/exitbind" "$GITHUB_WORKSPACE/skills/exitbind/SKILL.md"
      - name: Verify tag matches the binary
        if: needs.channel.outputs.readiness_only == 'false'
        run: test "v$("$CARGO_TARGET_DIR/release/exitbind" version)" = "$GITHUB_REF_NAME"
      - name: Package native Linux stable release
        run: ./tooling/repository/release/package-release.sh x86_64-unknown-linux-gnu "$CARGO_TARGET_DIR/release/exitbind" dist
      - name: Exercise packaged Linux installer
        run: ./tooling/repository/release/installer-smoke.sh dist x86_64-unknown-linux-gnu
      - name: Attest packaged archive provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/exitbind-x86_64-unknown-linux-gnu.tar.gz
      - name: Verify packaged archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/exitbind-x86_64-unknown-linux-gnu.tar.gz \
            --bundle "${{ steps.attest.outputs.bundle-path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Save Linux release evidence
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/x86_64-unknown-linux-gnu.bundle.json
      - name: Upload Linux release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: |
            dist/exitbind-x86_64-unknown-linux-gnu
            dist/exitbind-x86_64-unknown-linux-gnu.tar.gz
            dist/exitbind-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/x86_64-unknown-linux-gnu.bundle.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload Linux stable release for WSL
        if: needs.channel.outputs.full_platforms == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exitbind-linux-x86_64-${{ github.sha }}
          path: ${{ env.CARGO_TARGET_DIR }}/release/exitbind
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: channel
    if: needs.channel.outputs.full_platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            host_arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preserve published Git ancestry
        run: ./tooling/repository/release/check-public-history.sh
      - name: Require the release tag at the current main commit
        if: needs.channel.outputs.prerelease == 'false' && needs.channel.outputs.readiness_only == 'false'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Verify native macOS host and target
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "${{ matrix.host_arch }}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          printf 'runner=%s arch=%s os=%s target=%s commit=%s\n' \
            "${{ matrix.runner }}" "$(uname -m)" "$(sw_vers -productVersion)" \
            "${{ matrix.target }}" "$GITHUB_SHA"
      - name: Prepare reusable native build paths
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/exitbind-target
          EXITBIND_FIXTURE_ROOT: ${{ runner.temp }}/exitbind-fixtures
          EXITBIND_LOG_ROOT: ${{ runner.temp }}/exitbind-logs
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          target = os.path.realpath(os.environ["CARGO_TARGET_DIR"])
          relative = os.path.relpath(target, workspace)
          if os.path.isabs(relative) or not relative:
              raise SystemExit("Cargo target cache path must be relative to the workspace")
          print(f"EXITBIND_CACHE_TARGET={relative}")
          print(f"CARGO_TARGET_DIR={target}")
          print(f"TMPDIR={os.environ['EXITBIND_FIXTURE_ROOT']}")
          print(f"CI_LOG_ROOT={os.environ['EXITBIND_LOG_ROOT']}")
          PY
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> ${{ env.EXITBIND_CACHE_TARGET }}
          cache-targets: true
          cache-bin: false
          cache-all-crates: false
          cache-workspace-crates: false
      - name: Run shared native CI checks
        env:
          EXITBIND_FETCH_VALIDATOR: '1'
        run: ./tooling/repository/ci/ci-local.sh --checks-only
      - name: Build native macOS stable release
        env:
          EXITBIND_BUILD_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify tag matches the binary
        if: needs.channel.outputs.readiness_only == 'false'
        run: test "v$("$CARGO_TARGET_DIR/${{ matrix.target }}/release/exitbind" version)" = "$GITHUB_REF_NAME"
      - name: Package native macOS stable release
        run: ./tooling/repository/release/package-release.sh "${{ matrix.target }}" "$CARGO_TARGET_DIR/${{ matrix.target }}/release/exitbind" dist
      - name: Exercise packaged macOS installer
        run: ./tooling/repository/release/installer-smoke.sh dist "${{ matrix.target }}"
      - name: Attest packaged archive provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/exitbind-${{ matrix.target }}.tar.gz
      - name: Verify packaged archive provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/exitbind-${{ matrix.target }}.tar.gz" \
            --bundle "${{ steps.attest.outputs.bundle-path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Save macOS release evidence
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/${{ matrix.target }}.bundle.json"
      - name: Upload macOS release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/exitbind-${{ matrix.target }}
            dist/exitbind-${{ matrix.target }}.tar.gz
            dist/exitbind-${{ matrix.target }}.tar.gz.sha256
            dist/${{ matrix.target }}.bundle.json
          if-no-files-found: error
          retention-days: 1

  windows-wsl:
    needs: [channel, linux]
    if: needs.channel.outputs.full_platforms == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assert exact GitHub SHA checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'checkout does not match GITHUB_SHA' }
      - name: Download Linux stable release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: exitbind-linux-x86_64-${{ github.sha }}
          path: wsl-release
      - name: Install Ubuntu under WSL 2
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $distributions = (wsl.exe --list --verbose | Out-String) -replace "`0", ""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $distributions
          if ($distributions -notmatch 'Ubuntu\s+\w+\s+2') {
            throw 'Ubuntu was not installed as WSL 2'
          }
      - name: Exercise the installed Linux release inside WSL 2
        shell: pwsh
        run: |
          $windowsWorkspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $workspace = (& wsl.exe --distribution Ubuntu --user root -- wslpath -a $windowsWorkspace).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & wsl.exe --distribution Ubuntu --user root -- sh "$workspace/tooling/repository/ci/ci-wsl.sh" "$workspace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    needs: [channel, linux, macos, windows-wsl]
    if: ${{ always() && needs.channel.result == 'success' && needs.channel.outputs.readiness_only == 'false' && needs.linux.result == 'success' && (needs.channel.outputs.prerelease == 'true' || (needs.macos.result == 'success' && needs.windows-wsl.result == 'success')) }}
    env:
      RELEASE_TARGETS: ${{ needs.channel.outputs.targets }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preserve published Git ancestry
        run: ./tooling/repository/release/check-public-history.sh
      - name: Require the release tag at the current main commit
        if: needs.channel.outputs.prerelease == 'false' && needs.channel.outputs.readiness_only == 'false'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Download all target release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*-${{ github.sha }}
          path: release-evidence
          merge-multiple: true
      - name: Verify transferred release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tooling/repository/release/verify-release-evidence.sh
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tooling/repository/release/publish-release-assets.sh

  installed:
    needs: [channel, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.channel.outputs.installed) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Assert exact release tag checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$(git describe --exact-match --tags HEAD)" = "$GITHUB_REF_NAME"
      - name: Verify native installed-test host
        run: |
          test "$(uname -s)" = "${{ matrix.host_os }}"
          test "$(uname -m)" = "${{ matrix.host_arch }}"
      - name: Download same-workflow expected release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ matrix.target }}-${{ github.sha }}
          path: expected
      - name: Prepare expected artifact executable mode
        run: chmod 0755 "expected/exitbind-${{ matrix.target }}"
      - name: Retrieve and verify published installer
        env:
          EXITBIND_REPOSITORY: ${{ github.repository }}
          EXITBIND_VERSION: ${{ github.ref_name }}
        run: ./tooling/repository/release/published-install-smoke.sh "${{ matrix.target }}" "expected/exitbind-${{ matrix.target }}"

  stable-readiness-result:
    needs: [channel, linux, macos, windows-wsl]
    if: always() && needs.channel.outputs.readiness_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact GitHub SHA checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require every platform before recording stable readiness
        env:
          CHANNEL_RESULT: ${{ needs.channel.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WSL_RESULT: ${{ needs.windows-wsl.result }}
        run: python3 tooling/repository/release/write-stable-readiness.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-readiness-${{ github.sha }}
          path: stable-readiness.json
          if-no-files-found: error
          retention-days: 30
