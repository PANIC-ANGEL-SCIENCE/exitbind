name: Refresh README badges
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Exitbind / Exit", "Exitbind stable release"]
    types: [requested, in_progress, completed]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-badges
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'PANIC-ANGEL-SCIENCE/exitbind' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.name == 'Exitbind stable release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Always execute trusted main, never workflow_run artifacts or PR code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1
      - name: Validate badge tooling
        run: python3 -m unittest discover -s tooling/repository/ci/readme -v
      - name: Refresh isolated badge data
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tooling/repository/ci/readme/publish.sh
