[package]
name = "exitbind"
version = "0.31.17"
edition = "2021"
rust-version = "1.75"
description = "Bounded exact-subject acceptance and evidence binding before exit"
license = "MIT"
repository = "https://github.com/PANIC-ANGEL-SCIENCE/exitbind"

