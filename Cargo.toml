[package]
name = "exitbind"
version = "0.31.13"
edition = "2021"
rust-version = "1.75"
description = "Bounded exact-subject acceptance and evidence binding before exit"
license = "MIT"
repository = "https://github.com/PANIC-ANGEL-SCIENCE/exitbind"

exclude = ["assets/readme/**", "tooling/readme/**", ".github/workflows/readme-badges.yml"]

autobins = false

[[bin]]
name = "exitbind"
path = "src/main.rs"

[dependencies]
# serde/serde_json preserve the public JSON configuration, receipt, and JSONL schemas.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# sha2 provides the evidence hashes used by the existing append-only protocols.
sha2 = "0.10"
# chrono supplies portable, normalized ISO-8601 timestamps; std has no formatter.
chrono = { version = "0.4", default-features = true, features = ["clock"] }
# libc exposes POSIX O_NOFOLLOW and PID probes that std does not model.
libc = "0.2"
[profile.release]
strip = true
lto = true
codegen-units = 1
