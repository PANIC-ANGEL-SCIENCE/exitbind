  "SECURITY.md",
  "install.sh",
  "src/**",
  "schema/**",
  "compatibility/rename-matrix.json",
  "skills/**",
  "plugins/exitbind/**",
  "plugin.json",
  ".codex-plugin/plugin.json",
  ".claude-plugin/plugin.json",
  ".agents/plugins/marketplace.json",
  ".claude-plugin/marketplace.json",
  "proof/**",
  "examples/**",
  "tests/**",
  "scripts/demo-checked-work.sh",
  "docs/agent-control-plane.md",
  "docs/agent-first-evaluation.md",
  "docs/architecture-contract.md",
  "docs/check-recovery.md",
  "docs/check-replacement.md",
  "docs/codex-tmux-away.md",
  "docs/command-consumption.md",
  "docs/continuing-native-work.md",
  "docs/controlled-file-effects.md",
  "docs/cross-host-continuation.md",
  "docs/early-evidence.md",
  "docs/evidence/participation-comparison.md",
  "docs/exitbind-centered-layout.md",
  "docs/first-checked-run.md",
  "docs/glossary.md",
  "docs/goal-requirements.md",
  "docs/index.md",
  "docs/legacy-compatibility.md",
  "docs/native-continuity.md",
  "docs/onboarding.md",
  "docs/optional-surfaces.md",
  "docs/participation-validation.md",
  "docs/platform-support.md",
  "docs/post-0.3.0-harness-evidence.md",
  "docs/prereleases.md",
  "docs/project-capabilities.md",
  "docs/project-lessons.md",
  "docs/project-placement.md",
  "docs/project-continuation.md",
  "docs/prose-mechanism-audit.md",
  "docs/public-history.md",
  "docs/reference-run-and-recovery.md",
  "docs/release-boundary-governance-binding.md",
  "docs/release-version-policy.md",
  "docs/repair-a-run.md",
  "docs/residual-resume-cost.md",
